<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1621">
<title>Swing Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
  /* Tokens. Ink-blue ground; green/red only for money moving; marigold only for things you can act on. */
  :root {
    --ink: #0E1621;
    --panel: #142033;
    --raise: #1A2940;
    --line: #253753;
    --text: #E7EEF6;
    --muted: #8C9DB3;
    --gain: #34C77B;
    --loss: #F2555A;
    --act: #F4A83A;
    --act-ink: #1E1405;
    --r-sm: 6px;
    --r-md: 10px;
    --rail: 212px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--ink); color: var(--text);
    font: 15px/1.5 "Archivo", system-ui, sans-serif; font-variation-settings: "wdth" 100;
    font-variant-numeric: tabular-nums;
  }
  a { color: var(--act); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--act); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- shell ---------- */
  .rail {
    position: fixed; inset: 0 auto 0 0; width: var(--rail); padding: 22px 14px; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 2px; background: var(--ink);
  }
  .brand { font-weight: 800; font-size: 19px; font-variation-settings: "wdth" 118; letter-spacing: .2px; margin: 0 10px 22px; }
  .brand span { color: var(--act); }
  .nav a {
    display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: var(--r-sm);
    color: var(--muted); font-weight: 500;
  }
  .nav a:hover { color: var(--text); background: var(--panel); text-decoration: none; }
  .nav a[aria-current="page"] { color: var(--text); background: var(--raise); box-shadow: inset 3px 0 0 var(--act); }
  .nav svg { width: 18px; height: 18px; flex: 0 0 18px; }
  .rail .foot { margin-top: auto; padding: 0 10px; font-size: 12px; color: var(--muted); }
  .rail .foot button { all: unset; cursor: pointer; color: var(--muted); }
  .rail .foot button:hover { color: var(--text); }
  .rail .foot button[hidden] { display: none; }
  main { margin-left: var(--rail); padding: 26px 32px 60px; }
  .wrap { max-width: 1080px; }
  .topbar { display: none; }
  .tabbar { display: none; }

  @media (max-width: 899px) {
    .rail { display: none; }
    main { margin-left: 0; padding: 14px 16px calc(84px + env(safe-area-inset-bottom)); }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .topbar .brand { margin: 0; font-size: 18px; }
    .tabbar {
      display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; inset: auto 0 0 0; z-index: 10;
      background: rgba(14, 22, 33, .96); border-top: 1px solid var(--line); padding: 6px 2px calc(6px + env(safe-area-inset-bottom));
      backdrop-filter: blur(8px);
    }
    .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--muted); padding: 4px 0; }
    .tabbar a[aria-current="page"] { color: var(--act); }
    .tabbar svg { width: 21px; height: 21px; }
    .tabbar a:hover { text-decoration: none; }
  }

  /* ---------- type ---------- */
  h1 { font-size: 26px; line-height: 1.15; font-weight: 750; font-variation-settings: "wdth" 112; margin: 0 0 4px; }
  h2 { font-size: 17px; font-weight: 700; margin: 30px 0 10px; }
  h3 { font-size: 15px; font-weight: 650; margin: 0 0 8px; }
  .lede { color: var(--muted); margin: 0 0 18px; max-width: 68ch; }
  .note { color: var(--muted); font-size: 13px; margin: 6px 0 10px; max-width: 78ch; }
  .pos { color: var(--gain); }
  .neg { color: var(--loss); }
  .muted { color: var(--muted); }
  small { font-size: 12px; }

  /* ---------- controls ---------- */
  input, select {
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-sm);
    padding: 10px 12px; min-width: 0;
  }
  input::placeholder { color: #5E7089; }
  input:focus { border-color: var(--act); outline: none; }
  input[type=date] { color-scheme: dark; }
  button { font: inherit; cursor: pointer; }
  .btn {
    border: 0; border-radius: var(--r-sm); padding: 10px 18px; background: var(--act); color: var(--act-ink); font-weight: 700;
    white-space: nowrap;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: .55; cursor: wait; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 600; }
  .btn.ghost:hover { border-color: var(--muted); }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .btn.danger { background: transparent; color: var(--loss); border: 1px solid rgba(242, 85, 90, .4); font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
  .row > input { flex: 1 1 200px; }
  label.field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 130px; font-size: 12px; color: var(--muted); }
  label.check { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  label.check input { width: auto; }
  form { margin: 0; }

  /* ---------- surfaces ---------- */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 18px; }
  .panel + .panel { margin-top: 12px; }
  .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
  .cols > .panel + .panel { margin-top: 0; }
  @media (max-width: 899px) { .cols { grid-template-columns: 1fr; } }
  .status { color: var(--muted); padding: 18px 0; }
  .empty { color: var(--muted); padding: 14px 0 4px; }
  .banner { margin: 0 0 16px; padding: 10px 14px; border-radius: var(--r-sm); border: 1px solid rgba(244, 168, 58, .45); background: rgba(244, 168, 58, .08); font-size: 14px; }
  .error { margin-top: 14px; padding: 12px 14px; border-radius: var(--r-sm); border: 1px solid rgba(242, 85, 90, .45); background: rgba(242, 85, 90, .07); }

  /* Call badges: the one bold thing on every list. */
  .badge {
    display: inline-block; min-width: 62px; text-align: center; padding: 3px 8px; border-radius: 4px;
    font-weight: 850; font-size: 12.5px; letter-spacing: .6px; font-variation-settings: "wdth" 125;
    border: 1px solid var(--line); color: var(--muted);
  }
  .badge.go { color: var(--gain); border-color: rgba(52, 199, 123, .55); background: rgba(52, 199, 123, .08); }
  .badge.stop { color: var(--loss); border-color: rgba(242, 85, 90, .55); background: rgba(242, 85, 90, .08); }

  /* ---------- home ---------- */
  .market { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin: 4px 0 6px; }
  .market .level { font-size: 40px; font-weight: 800; line-height: 1; font-variation-settings: "wdth" 90; }
  .market .chg { font-size: 18px; font-weight: 650; }
  .market .state { font-size: 15px; }
  .kpis { display: flex; flex-wrap: wrap; gap: 14px 28px; margin: 6px 0 4px; }
  .kpi small { display: block; color: var(--muted); }
  .kpi b { font-size: 20px; font-weight: 750; }
  .more-link { display: inline-block; margin-top: 10px; font-size: 14px; font-weight: 600; }

  /* ---------- lists (portfolio / watchlist / ranking) ---------- */
  .list { border-top: 1px solid var(--line); }
  .item { border-bottom: 1px solid var(--line); }
  .item > .line, .listhead {
    display: grid; grid-template-columns: var(--cols, minmax(0, 1.6fr) repeat(4, minmax(0, 1fr)) 78px); gap: 10px;
    align-items: center; padding: 11px 4px; width: 100%; text-align: left; background: none; border: 0; color: inherit;
  }
  .listhead { color: var(--muted); font-size: 12px; padding: 8px 4px; }
  .listhead .num, .listhead .b { text-align: right; }
  .item > button.line { cursor: pointer; }
  .item > button.line:hover { background: rgba(255, 255, 255, .02); }
  .line .num { text-align: right; }
  .line .sym { font-weight: 700; }
  .line .sub { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line .b { text-align: right; }
  .detail { padding: 2px 4px 16px; }
  .detail .why { margin: 0 0 12px; max-width: 70ch; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .facts b { color: var(--text); font-weight: 600; }
  @media (max-width: 899px) {
    .listhead, .line .hide-sm { display: none; }
    .item > .line.wide { grid-template-columns: minmax(0, 1fr) auto auto; row-gap: 2px; }
    .line.wide .num.key { grid-column: 1; text-align: left; font-size: 13px; }
    .line.wide .b { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
    .line.wide .x { grid-column: 3; grid-row: 1 / span 2; align-self: center; }
  }

  /* ---------- tables (record, backtests) ---------- */
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--panel); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child, th.t, td.t { text-align: left; }
  tr:last-child td { border-bottom: 0; }
  th { font-weight: 600; color: var(--muted); font-size: 12px; }
  td.t { white-space: normal; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 10px; }
  .chip { border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
  .chip[aria-pressed="true"] { color: var(--act-ink); background: var(--act); border-color: var(--act); font-weight: 650; }

  /* ---------- reused renderers (trades / check) ---------- */
  .card { margin-top: 12px; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--panel); }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .sym { font-size: 18px; font-weight: 700; }
  .sector { color: var(--muted); font-size: 13px; }
  .order { margin: 8px 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 560px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .cell { padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--raise); }
  .cell small { display: block; color: var(--muted); font-size: 12px; }
  .cell span { font-weight: 650; }
  .hist { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .totals { margin-top: 14px; font-size: 14px; color: var(--muted); }
  .verdict { margin-top: 16px; padding: 14px 16px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--panel); }
  .verdict b { display: block; font-size: 17px; margin-bottom: 2px; }
  .verdict.ok { border-color: rgba(52, 199, 123, .5); }
  .session { margin-top: 16px; padding: 9px 13px; border-radius: var(--r-sm); border: 1px dashed var(--line); font-size: 14px; color: var(--muted); }
  .session b { color: var(--text); margin-right: 6px; }
  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gain); margin-right: 6px; vertical-align: middle; }
  h2.section { font-size: 20px; margin: 34px 0 4px; padding-top: 22px; border-top: 1px solid var(--line); }
  .opt { margin-top: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--panel); font-size: 14px; }
  .opt .why { color: var(--muted); margin-top: 4px; }
  .opt .lv { margin-top: 4px; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-left: 6px; }
  .skip { display: block; font-size: 12px; color: var(--loss); font-weight: 400; white-space: normal; }
  .skipped { margin: 8px 0 0; padding: 10px 12px; border-left: 3px solid var(--loss); font-size: 14px; }
  p.how { font-size: 14px; margin: 10px 0 0; }
  ul.reasons { list-style: none; padding: 0; margin: 10px 0 0; }
  ul.reasons li { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
  ul.reasons li:first-child { border-top: 0; }
  .pts { flex: 0 0 34px; text-align: right; font-weight: 750; }
  ul.notes { margin: 10px 0 0; padding-left: 18px; font-size: 14px; }
  ul.notes li { margin-bottom: 6px; }
  .big { font-size: 24px; font-weight: 750; }
  .callcard { margin-top: 18px; padding: 22px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); }
  .callcard.go { border-color: rgba(52, 199, 123, .6); box-shadow: inset 4px 0 0 var(--gain); }
  .callcard.stop { border-color: rgba(242, 85, 90, .6); box-shadow: inset 4px 0 0 var(--loss); }
  .callword { font-size: 58px; line-height: .95; font-weight: 900; font-variation-settings: "wdth" 125; letter-spacing: 1px; }
  .callcard.go .callword { color: var(--gain); }
  .callcard.stop .callword { color: var(--loss); }
  .callname { color: var(--muted); font-size: 14px; margin: 8px 0 10px; }
  .callline { font-size: 17px; font-weight: 600; margin-bottom: 12px; max-width: 62ch; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 14px; color: var(--muted); }
  .quick b { color: var(--text); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  details.more { margin-top: 14px; }
  details.more > summary, details.plain > summary { cursor: pointer; color: var(--act); font-weight: 600; padding: 6px 0; }
  details.plain { margin-top: 26px; font-size: 14px; color: var(--muted); }

  /* ---------- login ---------- */
  .gate { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--ink); padding: 16px; }
  .gate[hidden] { display: none; }
  .gate form { width: min(360px, 100%); }
  .gate .brand { margin: 0 0 6px; font-size: 26px; }
  .gate input { width: 100%; margin: 14px 0 10px; }
  .gate .btn { width: 100%; }
  .gate .err { color: var(--loss); font-size: 14px; min-height: 21px; margin-top: 8px; }
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form id="loginForm" autocomplete="on">
    <div class="brand">Swing<span>Picker</span></div>
    <p class="muted">Your private dashboard. Enter your password to open it.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
    <button class="btn" type="submit" id="unlockBtn">Unlock</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</div>

<nav class="rail" aria-label="Main">
  <div class="brand">Swing<span>Picker</span></div>
  <div class="nav" id="navRail"></div>
  <div class="foot"><span id="saveState"></span><br><button type="button" id="logoutBtn" hidden>Lock the app</button></div>
</nav>

<main>
  <div class="wrap">
    <div class="topbar"><div class="brand">Swing<span>Picker</span></div><span class="muted" id="topState"></span></div>
    <div id="view"></div>
  </div>
</main>

<nav class="tabbar" id="navTabs" aria-label="Main"></nav>
<datalist id="symlist"></datalist>

<script>
  const inr = (v, d = 0) => '₹' + Number(v).toLocaleString('en-IN', { minimumFractionDigits: d, maximumFractionDigits: d });
  const px = v => inr(v, 2);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ok = v => typeof v === 'number' && isFinite(v);
  const pct = (v, d = 1) => ok(v) ? (v >= 0 ? '+' : '−') + Math.abs(v * 100).toFixed(d) + '%' : 'n/a';
  const cls = v => !ok(v) ? '' : v >= 0 ? 'pos' : 'neg';
  const fmtDate = d => { try { return new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return d; } };
  const addSessions = (d, n) => { const t = new Date(d + 'T00:00:00'); while (n > 0) { t.setDate(t.getDate() + 1); if (t.getDay() !== 0 && t.getDay() !== 6) n--; } return t.toISOString().slice(0, 10); };
  const sgnR = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2) + 'R';

  function sessionBanner(x) {
    if (!x) return '';
    return `<div class="session">${x.live ? '<span class="live-dot"></span><b>Live</b>' : '<b>Next session</b>'}${esc(x.checkedAt)} · ${esc(x.message)}</div>`;
  }

  /* ---------- Momentum ---------- */
  function momentumSection(m) {
    if (!m) return '';
    const head = `<h2 class="section">Momentum portfolio · hold ~1 month</h2>
      <div class="verdict ${m.recommended ? 'ok' : ''}"><b>${m.recommended ? 'Recommended: ' + m.picks.length + ' stock' + (m.picks.length === 1 ? '' : 's') : 'Not recommended right now'}</b>${esc(m.reason)}</div>`;
    const o = m.outlook;
    const outlookNote = o && o.samples ? `<p class="note">Timeline: hold until <b>${esc(fmtDate(o.reviewDate))}</b>, then re-run the app. `
      + `"Typical" = the middle result of the ${o.samples} stock-months this strategy held in the backtest: ${pct(o.median)} `
      + `(half landed between ${pct(o.p25)} and ${pct(o.p75)}; ${Math.round(o.positiveShare * 100)}% ended up). `
      + `Last 12 months alone: ${pct(o.recentMedian)}. "Good/bad month" is each stock's own normal 1-month swing; about 2 months in 3 land between them. `
      + `None of these are promises: no stop-loss, so a bad month can be worse.</p>` : '';
    const pickCard = x => `<div class="card">
      <div class="head"><span class="sym">#${x.rank} ${esc(x.symbol)}</span><span class="sector">${esc(x.sector)}</span></div>
      <div class="order">${m.recommended ? 'Buy' : 'Would buy'} <b>${x.quantity}</b> share${x.quantity === 1 ? '' : 's'} ≈ ${inr(x.amount)}${m.livePrices ? ' at the live price' : ' at the next open'}.</div>
      <div class="grid">
        <div class="cell"><small>${m.livePrices ? 'Live price' : 'Last close'}</small><span>${px(x.lastClose)}</span></div>
        <div class="cell"><small>Hold until</small><span>${o ? esc(fmtDate(o.reviewDate)) : '~1 month'}</span></div>
        <div class="cell"><small>Typical target</small><span class="${cls(x.typicalTarget - x.lastClose)}">${px(x.typicalTarget)}</span><small>${o ? pct(o.median) : ''}</small></div>
        <div class="cell"><small>Past 6 / 12 mo</small><span class="${cls(x.return12m)}">${pct(x.return6m, 0)} / ${pct(x.return12m, 0)}</span></div>
        <div class="cell"><small>Good month</small><span class="pos">${px(x.lastClose * (1 + x.goodMonth))}</span><small>${pct(x.goodMonth)}</small></div>
        <div class="cell"><small>Bad month</small><span class="neg">${px(x.lastClose * (1 + x.badMonth))}</span><small>${pct(x.badMonth)}</small></div>
        <div class="cell"><small>If good month</small><span class="pos">+${inr(x.quantity * x.lastClose * x.goodMonth)}</span></div>
        <div class="cell"><small>If bad month</small><span class="neg">−${inr(Math.abs(x.quantity * x.lastClose * x.badMonth))}</span></div>
      </div>
    </div>`;
    const skippedAbove = m.picks.length
      ? m.ranking.filter(x => x.quantity === 0 && x.note && x.rank < m.picks[m.picks.length - 1].rank) : [];
    const skippedNote = skippedAbove.length ? `<div class="skipped">${skippedAbove.length} higher-ranked stock${skippedAbove.length === 1 ? ' was' : 's were'} skipped: `
      + skippedAbove.map(x => `<b>#${x.rank} ${esc(x.symbol)}</b> (${esc(x.note.replace(/^Skipped:\s*/, ''))})`).join(', ')
      + `.${skippedAbove.some(x => /costs more/.test(x.note)) ? ' A larger amount per stock would let the app buy them.' : ''}</div>` : '';
    const picks = m.picks.length ? `<h2>${m.recommended ? 'Buy' : 'What it would buy'} (${inr(m.perPosition)} each, ranked)</h2>`
      + m.picks.map(pickCard).join('') + skippedNote + outlookNote
      + (m.recommended ? `<p class="how">${esc(m.howToHold)}</p>` : '') : '';
    const others = m.ranking.filter(x => x.quantity === 0);
    const ranking = others.length ? `<h2>Rest of the ranking</h2>
      <p class="note">At your next re-check, keep a holding while it's still in the top ${Math.round(m.positions * 2)}.</p>
      <div class="tablewrap"><table>
        <tr><th>#</th><th class="t">Stock</th><th class="t">Sector</th><th>6 mo</th><th>12 mo</th><th>${m.livePrices ? 'Live price' : 'Last close'}</th></tr>
        ${others.map(x => `<tr><td>${x.rank}</td><td class="t">${esc(x.symbol)}${x.note ? `<span class="skip">${esc(x.note)}</span>` : ''}</td>
          <td class="t">${esc(x.sector)}</td>
          <td class="${cls(x.return6m)}">${pct(x.return6m, 0)}</td><td class="${cls(x.return12m)}">${pct(x.return12m, 0)}</td>
          <td>${px(x.lastClose)}</td></tr>`).join('')}
      </table></div>` : '';
    const bt = `<h2>How this strategy has done</h2>
      <p class="note">Monthly rebalance with ${m.positions} stock${m.positions === 1 ? '' : 's'} (what your amount allows), after charges. Last 12 months = since ${esc(m.recentFrom)}. "Worst fall" is the deepest drop from a peak.</p>
      <div class="tablewrap"><table>
        <tr><th>Strategy</th><th>Per year</th><th>Worst fall</th><th>Months up</th><th>Earlier, per year</th><th>Last 12 months</th></tr>
        ${m.backtest.map(r => `<tr><td>${esc(r.name)}</td>
          <td class="${cls(r.all.annualReturn)}">${pct(r.all.annualReturn)}</td>
          <td class="neg">−${(r.all.maxDrawdown * 100).toFixed(0)}%</td>
          <td>${Math.round(r.all.winningShare * 100)}%</td>
          <td class="${cls(r.earlier.annualReturn)}">${pct(r.earlier.annualReturn)}</td>
          <td class="${cls(r.recent.totalReturn)}">${pct(r.recent.totalReturn)}</td></tr>`).join('')}
      </table></div>`;
    return head + picks + ranking + bt;
  }

  /* ---------- Swing ---------- */
  function card(p) {
    const t = p.candidate.plan, e = p.candidate.edge;
    const reward = p.quantity * (t.target - t.entry);
    const expected = p.netR * p.riskRupees;
    return `<div class="card">
      <div class="head"><span class="sym">${esc(t.symbol)}</span><span class="sector">${esc(p.candidate.sector)}</span></div>
      <div class="order">Buy <b>${p.quantity}</b> share${p.quantity === 1 ? '' : 's'} at next open, ≈ ${inr(p.amount)}. Don't pay above <b>${px(t.maxEntry)}</b>.</div>
      <div class="grid">
        <div class="cell"><small>Reference price</small><span>${px(t.entry)}</span></div>
        <div class="cell"><small>Stop loss</small><span class="neg">${px(t.stop)}</span><small>${pct(t.stop / t.entry - 1)}</small></div>
        <div class="cell"><small>Target</small><span class="pos">${px(t.target)}</span><small>${pct(t.target / t.entry - 1)} upside</small></div>
        <div class="cell"><small>Exit if neither by</small><span>${esc(fmtDate(addSessions(t.signalDate, t.maxHoldDays + 1)))}</span><small>${t.maxHoldDays} sessions, ~3 weeks</small></div>
        <div class="cell"><small>Loss at stop</small><span class="neg">−${inr(p.riskRupees)}</span></div>
        <div class="cell"><small>Gain at target</small><span class="pos">+${inr(reward)}</span></div>
        <div class="cell"><small>Win rate (hist.)</small><span>${Math.round(e.winRate * 100)}%</span></div>
        <div class="cell"><small>Avg per trade, net</small><span class="${cls(expected)}">${expected >= 0 ? '+' : '−'}${inr(Math.abs(expected))}</span></div>
      </div>
      <div class="hist">Setup: ${esc(t.setupName)} on ${esc(t.signalDate)}. History: ${e.stockTrades} trades on this stock, ${e.poolTrades} across all stocks (blended). Expected ${sgnR(p.netR)} per trade after charges.</div>
    </div>`;
  }

  function setupTable(setups) {
    if (!setups || !setups.length) return '';
    const from = setups[0].recentFrom;
    const rows = setups.map(s => `<tr>
        <td>${esc(s.setup)}</td><td>${s.trades}</td><td>${Math.round(s.winRate * 100)}%</td>
        <td>+${s.avgWinR.toFixed(2)}R</td><td>−${s.avgLossR.toFixed(2)}R</td>
        <td class="${cls(s.expectancyR)}">${sgnR(s.expectancyR)}</td>
        <td class="${cls(s.earlierExpectancyR)}">${sgnR(s.earlierExpectancyR)} <span class="note">(${s.earlierTrades})</span></td>
        <td class="${cls(s.recentExpectancyR)}">${sgnR(s.recentExpectancyR)} <span class="note">(${s.recentTrades})</span></td></tr>`).join('');
    return `<h2>How each setup has done</h2>
      <p class="note">Every trade each rule would have taken over 5 years across all scanned stocks, before charges (charges cost roughly another 0.03–0.10R per trade). A setup is only used if it made money in both the earlier years and the last 12 months (since ${esc(from)}). "+ nifty-uptrend" = only when the Nifty 50 is above its rising 200-day average.</p>
      <div class="tablewrap"><table>
        <tr><th>Setup</th><th>Trades</th><th>Win rate</th><th>Avg win</th><th>Avg loss</th><th>Per trade</th><th>Earlier</th><th>Last 12 mo</th></tr>${rows}
      </table></div>`;
  }

  function otherOptions(considered) {
    const others = (considered || []).filter(c => !c.picked);
    if (!others.length) return '';
    return `<h2>Also fired today, not recommended</h2>
      <p class="note">Shown so you can decide for yourself. The reason is why the app passed on each.</p>`
      + others.map(c => {
        const t = c.candidate.plan, e = c.candidate.edge;
        return `<div class="opt">
          <b>${esc(t.symbol)}</b><span class="tag">${esc(t.setupName)}</span><span class="tag">${esc(c.candidate.sector)}</span>
          <div class="lv">Ref ${px(t.entry)} · stop ${px(t.stop)} (${pct(t.stop / t.entry - 1)}) · target ${px(t.target)} (${pct(t.target / t.entry - 1)}) · by ${esc(fmtDate(addSessions(t.signalDate, t.maxHoldDays + 1)))} · don't pay above ${px(t.maxEntry)}</div>
          <div class="lv">Hist. win rate ${Math.round(e.winRate * 100)}% · ${sgnR(c.candidate.expectedNetR)} per trade after charges · ${e.stockTrades} past trades on this stock</div>
          <div class="why">${esc(c.status)}</div>
        </div>`;
      }).join('');
  }

  function swingSection(s, session) {
    if (!s) return '';
    const head = `<h2 class="section">Swing trades · hold up to 3 weeks</h2>`
      + (session && session.live ? `<p class="note">Live: signals use today's price so far. They count only if they still hold at the 3:30 close.</p>` : '');
    if (!s.trade) {
      return head + `<div class="verdict"><b>No trade today.</b>${esc(s.reason)} (${s.stocksScanned} stocks scanned)</div>`
        + otherOptions(s.considered) + setupTable(s.setups);
    }
    const risk = s.picks.reduce((a, p) => a + p.riskRupees, 0);
    return head + `<div class="verdict ok"><b>${s.picks.length} ${session && session.live ? 'provisional ' : ''}pick${s.picks.length > 1 ? 's' : ''}, best first</b>${esc(s.reason)} (${s.stocksScanned} stocks scanned)</div>`
      + s.picks.map(card).join('')
      + `<div class="totals">Invested ≈ ${inr(s.investedAmount)} · Unused ${inr(s.unusedAmount)} · If every stop hits: −${inr(risk)} (plus charges)</div>`
      + otherOptions(s.considered) + setupTable(s.setups);
  }

  function analysisView(a, typedName) {
    const v = a.verdict, t = a.trend, mo = a.momentum, h = a.holding, c = a.consensus, call = a.call;
    const name = a.name && a.name !== a.symbol ? a.name : (typedName || a.symbol);
    const byLabel = l => a.outlook.find(o => o.label === l);
    const six = byLabel('6 months'), year = byLabel('1 year');
    const tone = { BUY: 'go', HOLD: 'go', SELL: 'stop', AVOID: 'stop' }[call.call] || '';
    const chanceLine = h && h.pnl < 0 && (six || year) ? `<span>Chance back above ${px(h.averagePrice)}: `
      + [six && ok(six.chanceAboveCost) ? `6 months <b>${Math.round(six.chanceAboveCost * 100)}%</b>` : '',
         year && ok(year.chanceAboveCost) ? `1 year <b>${Math.round(year.chanceAboveCost * 100)}%</b>` : ''].filter(Boolean).join(' · ') + `</span>` : '';
    const analystLine = c && ok(c.targetMean) && c.analysts
      ? `<span>Analysts' 1-year target: <b>${px(c.targetMean)}</b> (${pct(c.targetMean / a.price - 1)}, ${c.analysts} analyst${c.analysts === 1 ? '' : 's'}${c.rating ? ', ' + esc(c.rating.replace('_', ' ')) : ''})</span>`
      : `<span>Analysts' target: <b>not available</b></span>`;
    const typicalLine = year ? `<span>Typical in 1 year: <b>${px(year.typicalPrice)}</b> (${pct(year.median)})</span>` : '';
    const pnlLine = h ? `<span>Your P&L: <b class="${cls(h.pnl)}">${h.pnl >= 0 ? '+' : '−'}${inr(Math.abs(h.pnl))} (${pct(h.pnlPct)})</b></span>` : '';
    const callCard = `<div class="callcard ${tone}">
      <div class="callword">${esc(call.call)}</div>
      <div class="callname">${esc(name)} (${esc(a.symbol)}) · ${px(a.price)} ${a.livePrice ? 'live' : 'at the ' + esc(fmtDate(a.asOf)) + ' close'}</div>
      <div class="callline">${esc(call.headline)}</div>
      <div class="quick">${pnlLine}${chanceLine}${typicalLine}${analystLine}</div>
    </div>`;
    const head = `<div class="card">
      <div class="head"><span class="sym">${esc(name)} <span class="sector">(${esc(a.symbol)})</span></span>
        <span class="sector">${a.inUniverse ? esc(a.sector) : 'Not in the Nifty 200 · ranked against it'}</span></div>
      <div class="big">${px(a.price)}</div>
      <div class="note">${a.livePrice ? '<span class="live-dot"></span>Live price' : 'Close of ' + esc(fmtDate(a.asOf))}</div>
    </div>`;
    const verdict = `<div class="verdict ${v.points > 0 ? 'ok' : ''}"><b>${esc(v.label)} (${v.points > 0 ? '+' : ''}${v.points} points)</b>${esc(v.action)}
      <ul class="reasons">${v.reasons.map(r => `<li><span class="pts ${r.points > 0 ? 'pos' : r.points < 0 ? 'neg' : ''}">${r.points > 0 ? '+' : ''}${r.points}</span><span>${esc(r.text)}</span></li>`).join('')}</ul>
    </div>`;
    const holding = h ? `<h2>Your position</h2><div class="card">
      <div class="grid">
        <div class="cell"><small>Quantity · avg price</small><span>${h.quantity} · ${px(h.averagePrice)}</span></div>
        <div class="cell"><small>Invested → now</small><span>${inr(h.invested)} → ${inr(h.value)}</span></div>
        <div class="cell"><small>Profit / loss</small><span class="${cls(h.pnl)}">${h.pnl >= 0 ? '+' : '−'}${inr(Math.abs(h.pnl))}</span><small>${pct(h.pnlPct)}</small></div>
        <div class="cell"><small>${h.breakEvenGain > 0 ? 'Rise needed to break even' : 'Held'}</small><span>${h.breakEvenGain > 0 ? pct(h.breakEvenGain) : (h.daysHeld != null ? h.daysHeld + ' days' : 'in profit')}</span></div>
      </div>
      <ul class="notes">${h.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
    </div>` : '';
    const n = a.outlook.length ? a.outlook[0].samples : 0;
    const outlook = a.outlook.length ? `<h2>Outlook: what similar stocks did next</h2>
      <p class="note">Stocks ranked like this one on momentum${a.outlook[0].sameMarketState ? ', in the same kind of Nifty market as today,' : ''} between ${esc(fmtDate(a.historyFrom))} and ${esc(fmtDate(a.historyTo))}. "Typical" is the middle result; half of cases landed inside the range. Applied to today's price. Not a forecast for this company: it knows nothing about its results, news or valuation.</p>
      <div class="grid">${a.outlook.map(o => `<div class="cell">
        <small>${esc(o.label)} · ~${esc(fmtDate(o.around))}</small>
        <span class="${cls(o.median)}">${px(o.typicalPrice)}</span><small>${pct(o.median)} typical</small>
        <small>Range ${px(o.lowPrice)} – ${px(o.highPrice)}</small>
        <small>${Math.round(o.positiveShare * 100)}% ended up · all stocks ${pct(o.baselineMedian)}</small>
        ${h ? `<small class="${cls(o.typicalPrice - h.averagePrice)}">Typical is ${o.typicalPrice >= h.averagePrice ? 'above' : 'below'} your ${px(h.averagePrice)}</small>` : ''}
        ${h && ok(o.chanceAboveCost) ? `<small><b>${Math.round(o.chanceAboveCost * 100)}%</b> of cases ended above your price</small>` : ''}
        <small>${o.samples} cases</small>
      </div>`).join('')}</div>` : `<p class="note">Less than a year of prices, so there's no momentum rank or outlook yet.</p>`;
    const facts = `<h2>The facts behind it</h2><div class="grid">
      <div class="cell"><small>Momentum rank</small><span>${mo ? 'Beats ' + Math.round(mo.shareBeaten * 100) + '%' : 'n/a'}</span><small>of ${mo ? mo.ranked : 0} stocks</small></div>
      <div class="cell"><small>1 / 3 months</small><span class="${cls(t.return3m)}">${pct(t.return1m, 0)} / ${pct(t.return3m, 0)}</span></div>
      <div class="cell"><small>6 / 12 months</small><span class="${cls(t.return1y)}">${pct(t.return6m, 0)} / ${pct(t.return1y, 0)}</span></div>
      <div class="cell"><small>From 52-week high</small><span class="${cls(t.fromHigh)}">${pct(t.fromHigh)}</span><small>${px(t.low52w)} – ${px(t.high52w)}</small></div>
      <div class="cell"><small>vs 200-day average</small><span class="${cls(t.vsSma200)}">${pct(t.vsSma200)}</span><small>${ok(t.sma200) ? px(t.sma200) : 'n/a'}</small></div>
      <div class="cell"><small>50-day vs 200-day</small><span>${t.sma50AboveSma200 ? 'Above (uptrend)' : 'Below'}</span></div>
      <div class="cell"><small>Volatility (yearly)</small><span>${ok(t.volatility) ? Math.round(t.volatility * 100) + '%' : 'n/a'}</span></div>
      <div class="cell"><small>Nifty 50</small><span class="${a.niftyUptrend ? 'pos' : 'neg'}">${a.niftyUptrend == null ? 'n/a' : a.niftyUptrend ? 'Uptrend' : 'Not in uptrend'}</span></div>
    </div>`;
    const setups = a.setups.length ? `<h2>Swing setups on this stock today</h2>` + a.setups.map(s => `<div class="opt">
        <b>${esc(s.plan.setupName)}</b><span class="tag">${s.hasEdge ? 'counts: positive in both periods' : "doesn't count: not positive in both periods"}</span>
        <div class="lv">Ref ${px(s.plan.entry)} · stop ${px(s.plan.stop)} (${pct(s.plan.stop / s.plan.entry - 1)}) · target ${px(s.plan.target)} (${pct(s.plan.target / s.plan.entry - 1)}) · don't pay above ${px(s.plan.maxEntry)}</div>
        <div class="lv">Setup record: ${sgnR(s.record.expectancyR)} per trade (earlier ${sgnR(s.record.earlierExpectancyR)}, last 12 months ${sgnR(s.record.recentExpectancyR)})</div>
      </div>`).join('') : '';
    const fmtX = v => ok(v) ? v.toFixed(1) + '×' : 'n/a';
    const analysts = `<h2>What analysts and valuation say</h2>` + (c ? `<div class="grid">
      <div class="cell"><small>Average 1-year target</small><span>${ok(c.targetMean) ? px(c.targetMean) : 'n/a'}</span><small>${ok(c.targetMean) ? pct(c.targetMean / a.price - 1) + ' from here' : ''}</small></div>
      <div class="cell"><small>Target range</small><span>${ok(c.targetLow) && ok(c.targetHigh) ? px(c.targetLow) + ' – ' + px(c.targetHigh) : 'n/a'}</span></div>
      <div class="cell"><small>Analysts · rating</small><span>${c.analysts ?? 0}${c.rating ? ' · ' + esc(c.rating.replace('_', ' ')) : ''}</span></div>
      <div class="cell"><small>P/E (last 12 mo · next 12 mo)</small><span>${fmtX(c.trailingPE)} · ${fmtX(c.forwardPE)}</span></div>
      <div class="cell"><small>EPS (last · forecast)</small><span>${ok(c.trailingEps) ? px(c.trailingEps) : 'n/a'} · ${ok(c.forwardEps) ? px(c.forwardEps) : 'n/a'}</span></div>
      <div class="cell"><small>Earnings growth (yoy)</small><span class="${cls(c.earningsGrowth)}">${pct(c.earningsGrowth)}</span></div>
      <div class="cell"><small>Revenue growth (yoy)</small><span class="${cls(c.revenueGrowth)}">${pct(c.revenueGrowth)}</span></div>
      <div class="cell"><small>Debt / equity</small><span>${ok(c.debtToEquity) ? c.debtToEquity.toFixed(2) : 'n/a'}</span></div>
    </div><p class="note">An analyst's price target is usually forecast earnings per share × the P/E they think is fair. Targets lean optimistic on average, so the verdict only counts an upside above 15% (and only with 3+ analysts). Source: Yahoo Finance consensus.</p>`
      : `<p class="note">No analyst data could be loaded for this stock right now (small companies often have no coverage).</p>`);
    const rule = `<p class="note"><b>How the call is made:</b> ${esc(call.rule)}</p>`;
    return callCard + `<details class="more"><summary>Show all the details</summary>`
      + head + verdict + holding + outlook + analysts + facts + setups + rule
      + `<p class="note" style="margin-top:16px">Not investment or tax advice. The verdict counts signals; it doesn't know the company's results, debt, management or news. Check those too.</p></details>`;
  }


  /* =========================================================
     App shell: API, login, navigation
     ========================================================= */
  const $ = id => document.getElementById(id);
  const view = () => $('view');
  let saved = null;      // is data stored in the database?
  let lockOn = false;

  async function api(path, opts = {}) {
    const res = await fetch(path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...opts });
    let body = null;
    try { body = await res.json(); } catch (e) { /* empty body */ }
    if (res.status === 401 && body && body.locked) { showGate(); throw new Error('Locked'); }
    if (!res.ok) throw new Error((body && (body.error || body.marketDataError || body.pending)) || ('Request failed (HTTP ' + res.status + ')'));
    return body;
  }

  function showGate() { $('gate').hidden = false; setTimeout(() => $('pw').focus(), 30); }

  $('loginForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    $('unlockBtn').disabled = true; $('loginErr').textContent = '';
    try {
      const res = await fetch('/api/login', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: $('pw').value }) });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) { $('loginErr').textContent = body.error || 'Could not unlock.'; return; }
      $('gate').hidden = true; $('pw').value = '';
      $('logoutBtn').hidden = !lockOn;
      route();
    } finally { $('unlockBtn').disabled = false; }
  });

  $('logoutBtn').addEventListener('click', async () => { await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }); showGate(); });

      ${holdings.filter(h => h.call === 'SELL').slice(0, 3).map(h => `<div class="facts"><span>${badge(h.call)} <b>${esc(h.symbol)}</b></span><span>${esc(h.headline || '')}</span></div>`).join('')}
      <a class="more-link" href="#/portfolio">Open portfolio</a>`
      : `<p class="empty">Add the stocks you own to see HOLD or SELL for each, every day.</p><a class="more-link" href="#/portfolio">Add a holding</a>`}</div>`;

    const buys = d.watchlist.filter(w => w.call === 'BUY');
    const wl = `<div class="panel"><h3>Watchlist</h3>${d.watchlist.length ? (buys.length
        ? buys.map(w => `<div class="facts"><span>${badge(w.call)} <b>${esc(w.symbol)}</b></span><span>${px(w.price)}</span><span>${esc(w.headline)}</span></div>`).join('')
        : `<p class="empty">None of your ${d.watchlist.length} watched stock${d.watchlist.length === 1 ? ' is a BUY' : 's are a BUY'} right now.</p>`)
        + `<a class="more-link" href="#/watchlist">Open watchlist</a>`
      : `<p class="empty">Add stocks you're considering; the app tells you when one turns into a BUY.</p><a class="more-link" href="#/watchlist">Add a stock</a>`}</div>`;

    const top = (m.ranking || []).slice().sort((a, b) => a.rank - b.rank).slice(0, 8);
    const mom = `<div class="panel"><h3>Momentum leaders</h3>
      <p class="note">${m.recommended ? '<span class="pos">Recommended now.</span> ' : ''}${esc(m.reason)}</p>
      <div class="list">${top.map(x => `<div class="item"><div class="line" style="--cols:28px minmax(0,1fr) auto auto">
        <span class="muted">${x.rank}</span><span><span class="sym">${esc(x.symbol)}</span><span class="sub">${esc(x.sector)}</span></span>
        <span class="num ${cls(x.return12m)}">${pct(x.return12m, 0)} <small class="muted">1y</small></span><span class="num">${px(x.lastClose)}</span></div></div>`).join('')}</div>
      <a class="more-link" href="#/trades">Size a momentum portfolio</a></div>`;

    const fired = (s.considered || []);
    const sw = `<div class="panel"><h3>Swing signals today</h3>${fired.length
      ? `<p class="note">${esc(s.reason)}</p><div class="list">${fired.slice(0, 6).map(c => `<div class="item"><div class="line" style="--cols:minmax(0,1fr) auto">
          <span><span class="sym">${esc(c.candidate.plan.symbol)}</span><span class="sub">${esc(c.candidate.plan.setupName)}: ${esc(c.status)}</span></span>
          <span class="num">${c.picked ? '<span class="badge go">PICK</span>' : '<span class="badge">PASS</span>'}</span></div></div>`).join('')}</div>`
      : `<p class="empty">${esc(s.reason)}</p>`}<a class="more-link" href="#/trades">See swing trades</a></div>`;

    const tr = (d.track || []).filter(x => x.recommendedOnly === false);
    const trk = `<div class="panel"><h3>Track record</h3>${tr.some(x => x.closed || x.open)
      ? tr.map(x => `<div class="facts"><span><b>${x.kind === 'momentum' ? 'Momentum' : 'Swing'}</b></span>
          <span>${x.closed} closed, ${x.open} open</span>${x.closed ? `<span>won <b>${Math.round(x.winRate * 100)}%</b></span>
          <span>avg <b class="${cls(x.avgReturn)}">${pct(x.avgReturn)}</b> vs Nifty ${pct(x.avgBenchmark)}</span>` : ''}</div>`).join('')
      : `<p class="empty">Every pick from now on is logged and graded automatically. Results show up as trades finish.</p>`}
      <a class="more-link" href="#/record">Open track record</a></div>`;

    view().innerHTML = notSavedBanner() + hero + `<div class="cols" style="margin-top:18px">${pf}${wl}</div>`
      + `<div class="cols" style="margin-top:12px">${mom}${sw}</div><div style="margin-top:12px">${trk}</div>`;
  }

      ev.preventDefault();

      if ($('own').checked) {
        if (!$('qty').value || !$('avg').value) { $('out2').innerHTML = errorBox('Add quantity and average price, or untick "I own this stock".'); return; }
        q.set('qty', $('qty').value); q.set('avgPrice', $('avg').value);

      }
      $('go2').disabled = true;
      $('out2').innerHTML = `<div class="status">Checking ${esc(symbol)} against about 200 stocks and 5 years of history.</div>`;
      try {
        const a = await api('/api/stock?' + q.toString());

        $('out2').innerHTML = analysisView(a, typed) + `<div class="actions">

          <button class="btn ghost" type="button" id="watchIt">Add to watchlist</button><span id="actMsg" class="muted" style="align-self:center"></span></div>`;
        if (owned) $('saveHolding').addEventListener('click', async () => {
          try {
            await api('/api/portfolio', { method: 'POST', body: JSON.stringify({ symbol, quantity: Number($('qty').value), averagePrice: Number($('avg').value), buyDate: $('bdate').value || null }) });
            $('actMsg').innerHTML = 'Saved. <a href="#/portfolio">Open portfolio</a>';
          } catch (e) { $('actMsg').textContent = e.message; }
        });
        $('watchIt').addEventListener('click', async () => {
          try { await api('/api/watchlist', { method: 'POST', body: JSON.stringify({ symbol }) }); $('actMsg').innerHTML = 'Added. <a href="#/watchlist">Open watchlist</a>'; }
          catch (e) { $('actMsg').textContent = e.message; }
        });
      } catch (e) { $('out2').innerHTML = errorBox(e); } finally { $('go2').disabled = false; }

          <span>Stock</span><span class="num">Price</span><span class="num">Profit / loss</span><span class="num">Back to cost in 1y</span><span class="num">Typical in 1y</span><span class="b">Call</span></div>
        ${rows}</div>` : `<p class="empty">No holdings yet. Add what you own and the app gives each one a HOLD or SELL, every day.</p>`)
      + `<h2>Add a holding</h2>${holdingForm('addForm')}<div id="addMsg"></div>`;

        if (!confirmRemove(el, h)) return;
      });

          ev.preventDefault();

      ev.preventDefault();

      btn.disabled = true; $('addMsg').innerHTML = '<div class="status">Checking the stock and adding it.</div>';

        await api('/api/portfolio', { method: 'POST', body: JSON.stringify({ symbol: symbolFrom(v.symbol), quantity: Number(v.quantity), averagePrice: Number(v.averagePrice), buyDate: v.buyDate || null }) });
        renderPortfolio();
      } catch (e) { $('addMsg').innerHTML = errorBox(e); btn.disabled = false; }
    });
  }

  /* Two-step remove: first click asks, second click removes. No browser dialogs. */
  function confirmRemove(el, h) {
    const b = el.querySelector('[data-del]');
    if (b.dataset.armed) {
      api('/api/portfolio/' + h.holdingId, { method: 'DELETE' }).then(renderPortfolio).catch(e => el.insertAdjacentHTML('beforeend', errorBox(e)));
      return true;
    }
    b.dataset.armed = '1'; b.textContent = 'Click again to remove ' + h.symbol;
    setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Remove'; } }, 4000);
    return false;
  }

  /* =========================================================
     Track record
     ========================================================= */
  const STATUS = { open: 'Running', target: 'Hit target', stop: 'Hit stop', time: 'Time exit', 'no-fill': 'Not filled', done: 'Done' };
  let trackFilter = { kind: 'all', rec: false };

  async function renderRecord() {
    view().innerHTML = `<h1>Track record</h1><div class="status">Grading every logged pick against what the market did.</div>`;
    let r;
    try { r = await api('/api/track'); } catch (e) { view().innerHTML = `<h1>Track record</h1>` + errorBox(e); return; }
    saved = r.saved; paintSaveState();
    const block = (kind, title) => {
      const rec = r.summaries.find(x => x.kind === kind && x.recommendedOnly), all = r.summaries.find(x => x.kind === kind && !x.recommendedOnly);
      const line = (x, label) => !x || (!x.closed && !x.open) ? `<div class="facts"><span><b>${label}</b></span><span>No picks yet</span></div>`
        : `<div class="facts"><span><b>${label}</b></span><span>${x.closed} closed, ${x.open} open${x.noFill ? ', ' + x.noFill + ' not filled' : ''}</span>
          ${x.closed ? `<span>won <b>${Math.round(x.winRate * 100)}%</b></span><span>average <b class="${cls(x.avgReturn)}">${pct(x.avgReturn)}</b></span>
          ${kind === 'swing' && ok(x.avgR) ? `<span><b class="${cls(x.avgR)}">${sgnR(x.avgR)}</b> per trade</span>` : ''}
          <span>Nifty same dates ${pct(x.avgBenchmark)}</span><span>beat Nifty <b>${Math.round(x.beatBenchmark * 100)}%</b></span>` : ''}</div>`;
      return `<div class="panel"><h3>${title}</h3>${line(rec, 'Recommended')}${line(all, 'Everything it flagged')}</div>`;
    };
    const filtered = r.calls.filter(c => (trackFilter.kind === 'all' || c.kind === trackFilter.kind) && (!trackFilter.rec || c.recommended));
    const chip = (label, on, attr) => `<button class="chip" type="button" aria-pressed="${on}" ${attr}>${label}</button>`;
    view().innerHTML = `<h1>Track record</h1>${notSavedBanner()}
      <p class="lede">Every pick the app made, graded with the same rules as its backtest: next-open entry, stop first if both levels are touched, and a time exit. Momentum is valued one holding period later. Before charges.</p>
      <div class="cols">${block('momentum', 'Momentum (top 5, monthly)')}${block('swing', 'Swing setups')}</div>
      <h2>Every pick</h2>
      <div class="chips">${chip('All', trackFilter.kind === 'all', 'data-k="all"')}${chip('Momentum', trackFilter.kind === 'momentum', 'data-k="momentum"')}${chip('Swing', trackFilter.kind === 'swing', 'data-k="swing"')}
        ${chip('Recommended only', trackFilter.rec, 'data-rec')}</div>
      ${filtered.length ? `<div class="tablewrap"><table>
        <tr><th>Signal</th><th class="t">Stock</th><th class="t">Kind</th><th class="t">Result</th><th>Entry</th><th>Exit</th><th>Return</th><th>Nifty</th><th>R</th></tr>
        ${filtered.map(c => `<tr><td>${esc(fmtDate(c.signalDate))}</td><td class="t"><b>${esc(c.symbol)}</b>${c.recommended ? ' <span class="tag">recommended</span>' : ''}</td>
          <td class="t">${esc(c.kind === 'momentum' ? 'momentum' : c.setup)}</td><td class="t">${esc(STATUS[c.status] || c.status)}</td>
          <td>${ok(c.entryPrice) ? px(c.entryPrice) : '–'}</td><td>${ok(c.exitPrice) ? px(c.exitPrice) : '–'}</td>
          <td class="${cls(c.returnPct)}">${ok(c.returnPct) ? pct(c.returnPct) : '–'}</td><td>${ok(c.benchmark) ? pct(c.benchmark) : '–'}</td>
          <td class="${cls(c.rMultiple)}">${ok(c.rMultiple) ? sgnR(c.rMultiple) : ''}</td></tr>`).join('')}
      </table></div>` : `<p class="empty">No picks logged yet. They're added whenever Home or Find trades runs after the close, or by the daily job.</p>`}`;
    view().querySelectorAll('.chip[data-k]').forEach(b => b.addEventListener('click', () => { trackFilter.kind = b.dataset.k; renderRecord(); }));
    view().querySelector('.chip[data-rec]').addEventListener('click', () => { trackFilter.rec = !trackFilter.rec; renderRecord(); });
  }

  /* =========================================================
     Router
     ========================================================= */
  function paintSaveState() {
    const t = saved === false ? 'Not saved (no database)' : saved ? 'Saved to your database' : '';
    $('saveState').textContent = t;
    $('topState').textContent = saved === false ? 'Not saved' : '';
  }

  const SCREENS = { home: renderHome, trades: renderTrades, check: renderCheck, portfolio: renderPortfolio,
                    watchlist: renderWatchlist, record: renderRecord };
  function route() {
    const [path, query] = (location.hash.replace(/^#\/?/, '') || 'home').split('?');
    const key = SCREENS[path] ? path : 'home';
    document.querySelectorAll('.nav a[data-k], .tabbar a[data-k]').forEach(a => {
      if (a.dataset.k === key) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    window.scrollTo(0, 0);
    SCREENS[key](new URLSearchParams(query || ''));
  }
  window.addEventListener('hashchange', route);

  (async () => {
    try {
      const s = await (await fetch('/api/session', { credentials: 'same-origin' })).json();
      lockOn = s.lockEnabled;
      $('logoutBtn').hidden = !s.lockEnabled;
      if (s.lockEnabled && !s.unlocked) { showGate(); return; }
    } catch (e) { /* the screens will show the error */ }
    route();
  })();
</script>
</body>
</html>
