<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swing Picker</title>
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#6b6b66; --line:#e2e2dc; --accent:#1f6f4a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --fg:#ecece6; --muted:#9a9a93; --line:#2e2e2b; --accent:#5cc28f; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:40px 16px; }
  h1 { font-size:24px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:10px 12px; font-size:16px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); }
  button { padding:10px 18px; font-size:16px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  pre { margin-top:20px; padding:14px; border:1px solid var(--line); border-radius:8px; white-space:pre-wrap; word-break:break-word; font-size:14px; }
  small { color:var(--muted); display:block; margin-top:24px; }
</style>
</head>
<body>
<main>
  <h1>Swing Picker</h1>
  <p class="sub">How much do you want to invest today?</p>
  <form id="f">
    <input id="amount" type="number" min="1" step="1" placeholder="10000" required>
    <button type="submit">Find trades</button>
  </form>
  <pre id="out" hidden></pre>
  <small>Not financial advice. Paper trade first. First request after idle can take ~1 min (free hosting wakes up).</small>
</main>
<script>
  const out = document.getElementById('out');
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    out.hidden = false;
    out.textContent = 'Working…';
    try {
      const res = await fetch('/api/recommend', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount: Number(document.getElementById('amount').value) })
      });
      out.textContent = 'HTTP ' + res.status + '\n' + JSON.stringify(await res.json(), null, 2);
    } catch (err) {
      out.textContent = 'Request failed: ' + err;
    }
  });
</script>
</body>
</html>
